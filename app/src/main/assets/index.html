<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEXUS Earth</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; height:100%; width:100%; touch-action:none; }
  #canvas-wrap { position:absolute; inset:0; }
  #hud { position:absolute; top:env(safe-area-inset-top,10px); left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:10; padding:0 6px; flex-wrap:wrap; }
  #hud2 { position:absolute; top:calc(env(safe-area-inset-top,10px) + 40px); left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:10; padding:0 6px; flex-wrap:wrap; }
  .layer-btn, .mode-btn {
    background:rgba(20,20,30,0.65); color:#dfe8ff; border:1px solid rgba(150,180,255,0.35);
    border-radius:20px; padding:7px 12px; font-family:sans-serif; font-size:12px;
    backdrop-filter: blur(6px); user-select:none;
  }
  .layer-btn.active, .mode-btn.active { background:rgba(80,140,255,0.85); border-color:#fff; color:#fff; }
  #playBtn { background:rgba(30,160,90,0.75); border-color:#9f9; }
  #playBtn.active { background:rgba(220,80,60,0.85); border-color:#fff; }
  #info { position:absolute; bottom:env(safe-area-inset-bottom,50px); left:0; right:0; text-align:center;
    color:#cfe0ff; font-family:sans-serif; font-size:12px; z-index:10; text-shadow:0 1px 3px #000; pointer-events:none; }
  #forecastBar { position:absolute; bottom:env(safe-area-inset-bottom,14px); left:10px; right:10px; z-index:10;
    color:#dfe8ff; font-family:sans-serif; font-size:11px; text-align:center; display:none; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#9fc; font-family:sans-serif; font-size:14px; z-index:20; background:#000; }
  #panel { position:absolute; left:12px; right:12px; bottom:70px; max-height:55%; overflow-y:auto;
    background:rgba(10,12,20,0.9); border:1px solid rgba(150,180,255,0.35); border-radius:12px;
    color:#e8eeff; font-family:sans-serif; font-size:13px; padding:14px; z-index:30; display:none;
    backdrop-filter: blur(8px); }
  #panel h3 { margin:0 0 8px 0; color:#9fd0ff; }
  #panel .close { position:absolute; top:8px; right:12px; color:#aaa; font-size:18px; }
  #panel .note { color:#8fa; font-size:11px; margin-top:8px; }
  #panel .cme { border-top:1px solid rgba(255,255,255,0.15); padding-top:6px; margin-top:6px; }
</style>
</head>
<body>
<div id="loading">Loading Earth…</div>
<div id="canvas-wrap"></div>
<div id="hud">
  <div class="mode-btn active" data-mode="earth">Earth</div>
  <div class="mode-btn" data-mode="solar">Solar System</div>
  <div class="mode-btn" id="gravityToggle">Clear Gravity Fields</div>
</div>
<div id="hud2">
  <div class="layer-btn" id="clearLayers">Globe</div>
  <div class="layer-btn" data-layer="temp">Temp</div>
  <div class="layer-btn" data-layer="precip">Precip</div>
  <div class="layer-btn" data-layer="clouds">Clouds</div>
  <div class="layer-btn" data-layer="pressure">Pressure</div>
  <div class="layer-btn" data-layer="wind">Wind</div>
  <div class="layer-btn" id="playBtn">▶ Forecast</div>
</div>
<div id="info">Drag to rotate • Pinch to zoom • Tap Sun or planets for info</div>
<div id="liveUpdated" style="position:absolute; bottom:env(safe-area-inset-bottom,68px); left:0; right:0; text-align:center; color:#8fdca0; font-family:sans-serif; font-size:10px; z-index:10; pointer-events:none;"></div>
<div id="forecastBar"></div>
<div id="panel"><span class="close">✕</span><div id="panelBody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var scene, camera, renderer;
  var earthGroup, globe, cloudMesh, atmosphere, moonMesh, sunLight, sunSprite;
  var rotateSpeed = 0.0008;
  var autoRotate = true;
  var activeLayers = {}; // layer -> true if currently toggled on
  var overlayMeshes = {}; // layer -> THREE.Points mesh
  var LIVE_REFRESH_MS = 10 * 60 * 1000; // Open-Meteo's underlying models update roughly hourly;
                                          // 10 min keeps things current without hammering the API.
  var liveRefreshTimer = null;
  var mode = "earth"; // "earth" | "solar"
  var solarGroup = null;
  var planetMeshes = {}; // key -> {mesh, data}
  var gravityMeshes = [];
  var raycaster = new THREE.Raycaster();
  var clickableObjects = [];

  // Forecast playback state
  var forecastPlaying = false;
  var forecastData = null; // {times:[], gridPoints:[{lat,lon,values:{layer:[...]}}]}
  var forecastIndex = 0;
  var forecastTimer = null;

  // --- Real orbital reference data (approximate mean elements, J2000 epoch) ---
  // a = semi-major axis (AU), period = sidereal orbital period (days),
  // L0 = approximate mean longitude at J2000 epoch (degrees) — circular-orbit approximation for visualization.
  // massEarth = mass relative to Earth (real values) — used for Hill sphere gravity-influence radius.
  var PLANETS = [
    {name:"Mercury", a:0.387, period:87.97,   L0:252.25, massEarth:0.055,  radius:0.010, color:0x9a8f86, moons:[]},
    {name:"Venus",   a:0.723, period:224.70,  L0:181.98, massEarth:0.815,  radius:0.024, color:0xd9c48a, moons:[]},
    {name:"Earth",   a:1.000, period:365.256, L0:100.46, massEarth:1.0,    radius:0.025, color:0x2f6fd0, moons:[{name:"Moon", dist:0.045, period:27.3, radius:0.007, color:0xbbbbbb}]},
    {name:"Mars",    a:1.524, period:686.98,  L0:355.45, massEarth:0.107,  radius:0.014, color:0xc1531f, moons:[{name:"Phobos",dist:0.035,period:0.32,radius:0.003,color:0x998877},{name:"Deimos",dist:0.05,period:1.26,radius:0.003,color:0x998877}]},
    {name:"Jupiter", a:5.203, period:4332.59, L0:34.40,  massEarth:317.8,  radius:0.11,  color:0xd8ae7e, moons:[
      {name:"Io",dist:0.16,period:1.77,radius:0.006,color:0xe8d060},
      {name:"Europa",dist:0.19,period:3.55,radius:0.006,color:0xd8d8c8},
      {name:"Ganymede",dist:0.24,period:7.15,radius:0.008,color:0xa89888},
      {name:"Callisto",dist:0.30,period:16.7,radius:0.008,color:0x807060}]},
    {name:"Saturn",  a:9.537, period:10759.22,L0:49.94,  massEarth:95.2,   radius:0.095, color:0xe3d4a3, moons:[
      {name:"Titan",dist:0.20,period:15.9,radius:0.007,color:0xd8a94f},
      {name:"Rhea",dist:0.15,period:4.5,radius:0.004,color:0xaaaaaa}], hasRing:true},
    {name:"Uranus",  a:19.191,period:30688.5, L0:313.23, massEarth:14.5,   radius:0.05,  color:0x9fd8dd, moons:[
      {name:"Titania",dist:0.13,period:8.7,radius:0.004,color:0xaaaaaa},
      {name:"Oberon",dist:0.17,period:13.5,radius:0.004,color:0x999999}]},
    {name:"Neptune", a:30.069,period:60182,   L0:304.88, massEarth:17.1,   radius:0.048, color:0x4a6fdd, moons:[
      {name:"Triton",dist:0.14,period:5.9,radius:0.005,color:0xb8c8d8}]},
    {name:"Pluto",   a:39.482,period:90560,   L0:238.93, massEarth:0.0022, radius:0.006, color:0xcbb8a0, moons:[
      {name:"Charon",dist:0.03,period:6.4,radius:0.003,color:0x998f88}]}
  ];
  var AU_SCALE = 9; // 1 AU -> this many scene units in solar view
  var SUN_MASS_EARTH = 333000;

  function init(){
    var wrap = document.getElementById('canvas-wrap');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 5000);
    camera.position.z = 2.6;

    renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    wrap.appendChild(renderer.domElement);

    addStarfield();

    sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
    sunLight.position.set(5,3,5);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x30304a, 1.0));

    buildEarthGroup();
    buildSolarGroup();
    solarGroup.visible = false;

    setupTouch(renderer.domElement);
    setupHUD();
    window.addEventListener('resize', onResize);
    animate();
  }

  function addStarfield(){
    var starGeo = new THREE.BufferGeometry();
    var starCount = 3000;
    var starPositions = new Float32Array(starCount*3);
    for(var i=0;i<starCount;i++){
      var r = 400 + Math.random()*600;
      var theta = Math.random()*Math.PI*2;
      var phi = Math.acos(2*Math.random()-1);
      starPositions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
      starPositions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
      starPositions[i*3+2] = r*Math.cos(phi);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions,3));
    var starMat = new THREE.PointsMaterial({color:0xffffff, size:0.5, sizeAttenuation:true});
    scene.add(new THREE.Points(starGeo, starMat));
  }

  // ---------------- EARTH VIEW ----------------
  function buildEarthGroup(){
    earthGroup = new THREE.Group();
    scene.add(earthGroup);

    var loader = new THREE.TextureLoader();
    loader.crossOrigin = "anonymous";
    var earthTex = loader.load(
      "https://unpkg.com/three-globe@2/example/img/earth-blue-marble.jpg",
      onFirstTextureLoaded,
      undefined,
      function(err){ console.error('Earth texture failed to load', err); onFirstTextureLoaded(true); }
    );
    var bumpTex = loader.load("https://unpkg.com/three-globe@2/example/img/earth-topology.png", undefined, undefined,
      function(err){ console.error('Bump texture failed to load', err); });
    var specTex = loader.load("https://unpkg.com/three-globe@2/example/img/earth-water.png", undefined, undefined,
      function(err){ console.error('Specular texture failed to load', err); });

    var geo = new THREE.SphereGeometry(1, 64, 64);
    var mat = new THREE.MeshPhongMaterial({
      map: earthTex, bumpMap: bumpTex, bumpScale: 0.03,
      specularMap: specTex, specular: new THREE.Color(0x333333), shininess: 6
    });
    globe = new THREE.Mesh(geo, mat);
    earthGroup.add(globe);

    var cloudTex = loader.load(
      "https://unpkg.com/three-globe@2/example/img/earth-clouds.png",
      function(){ cloudMesh.visible = true; },
      undefined,
      function(err){ console.error('Cloud texture failed to load', err); cloudMesh.visible = false; setInfoWarning('Cloud texture failed to load — check connection'); }
    );
    var cloudGeo = new THREE.SphereGeometry(1.006, 64, 64);
    var cloudMat = new THREE.MeshLambertMaterial({map:cloudTex, transparent:true, opacity:0.5, depthWrite:false});
    cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
    cloudMesh.visible = false; // shown once the texture actually loads, so a failed load doesn't render a flat gray shell
    earthGroup.add(cloudMesh);

    var atmoGeo = new THREE.SphereGeometry(1.06, 48, 48);
    var atmoMat = new THREE.ShaderMaterial({
      vertexShader: `varying vec3 vNormal; void main(){ vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `varying vec3 vNormal; void main(){ float intensity = pow(0.65 - dot(vNormal, vec3(0,0,1.0)), 3.0); gl_FragColor = vec4(0.3,0.6,1.0,1.0) * intensity; }`,
      blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent: true
    });
    atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
    earthGroup.add(atmosphere);

    // Moon — real phase comes naturally from Phong shading + directional light,
    // positioned using the actual current lunar phase angle.
    var moonGeo = new THREE.SphereGeometry(0.27, 32, 32);
    var moonMat = new THREE.MeshPhongMaterial({color:0xbbbbbb, shininess:1});
    moonMesh = new THREE.Mesh(moonGeo, moonMat);
    earthGroup.add(moonMesh);
    positionMoon();
    clickableObjects.push({obj:moonMesh, type:'moon'});

    // Sun indicator — small glowing sprite along the light direction, clickable for CME data.
    var sunGeo = new THREE.SphereGeometry(0.12, 24, 24);
    var sunMat = new THREE.MeshBasicMaterial({color:0xffdd66});
    sunSprite = new THREE.Mesh(sunGeo, sunMat);
    var sunGlowGeo = new THREE.SphereGeometry(0.18, 24, 24);
    var sunGlowMat = new THREE.MeshBasicMaterial({color:0xffaa33, transparent:true, opacity:0.35});
    sunSprite.add(new THREE.Mesh(sunGlowGeo, sunGlowMat));
    sunSprite.position.copy(sunLight.position).normalize().multiplyScalar(4.2);
    earthGroup.add(sunSprite);
    clickableObjects.push({obj:sunSprite, type:'sun'});
  }

  function positionMoon(){
    // Real synodic lunar phase calculation.
    // Reference new moon: 2000-01-06 18:14 UTC. Synodic month: 29.530588853 days.
    var refNewMoon = Date.UTC(2000,0,6,18,14,0);
    var now = Date.now();
    var daysSince = (now - refNewMoon) / 86400000;
    var synodic = 29.530588853;
    var phaseFrac = (daysSince % synodic) / synodic; // 0 = new, 0.5 = full
    if(phaseFrac < 0) phaseFrac += 1;
    var angle = phaseFrac * Math.PI * 2;
    var dist = 2.6;
    moonMesh.position.set(Math.cos(angle)*dist, 0.15*Math.sin(angle*0.3), Math.sin(angle)*dist);
    window._moonPhaseFrac = phaseFrac;
  }

  function onFirstTextureLoaded(failed){
    document.getElementById('loading').style.display = 'none';
    if(failed){ setInfoWarning('Earth texture failed to load — check connection, then reopen the app'); }
  }

  // Shows a temporary message in the info line, then reverts to the normal instructions after a few seconds.
  var infoWarningTimer = null;
  function setInfoWarning(msg, ms){
    var el = document.getElementById('info');
    if(infoWarningTimer) clearTimeout(infoWarningTimer);
    el.textContent = msg;
    infoWarningTimer = setTimeout(function(){
      el.textContent = mode==='earth'
        ? 'Drag to rotate • Pinch to zoom • Tap Sun or Moon for info'
        : 'Drag to orbit • Pinch to zoom • Tap Sun or a planet for info';
    }, ms || 6000);
  }

  // ---------------- SOLAR SYSTEM VIEW ----------------
  function buildSolarGroup(){
    solarGroup = new THREE.Group();
    scene.add(solarGroup);

    var sunGeo = new THREE.SphereGeometry(0.4, 32, 32);
    var sunMat = new THREE.MeshBasicMaterial({color:0xffcc44});
    var sunMesh = new THREE.Mesh(sunGeo, sunMat);
    solarGroup.add(sunMesh);
    var glowGeo = new THREE.SphereGeometry(0.55, 32, 32);
    var glowMat = new THREE.MeshBasicMaterial({color:0xff9922, transparent:true, opacity:0.3});
    sunMesh.add(new THREE.Mesh(glowGeo, glowMat));
    clickableObjects.push({obj:sunMesh, type:'sun'});
    planetMeshes['Sun'] = {mesh:sunMesh, data:{name:'Sun', massEarth:SUN_MASS_EARTH, a:0}};

    var jd = daysSinceJ2000();

    PLANETS.forEach(function(p){
      var orbitGeo = new THREE.RingGeometry(p.a*AU_SCALE-0.005, p.a*AU_SCALE+0.005, 128);
      var orbitMat = new THREE.MeshBasicMaterial({color:0x445577, side:THREE.DoubleSide, transparent:true, opacity:0.35});
      var orbitRing = new THREE.Mesh(orbitGeo, orbitMat);
      orbitRing.rotation.x = Math.PI/2;
      solarGroup.add(orbitRing);

      var angleDeg = (p.L0 + 360*(jd/p.period)) % 360;
      var angle = angleDeg * Math.PI/180;
      var x = Math.cos(angle)*p.a*AU_SCALE;
      var z = Math.sin(angle)*p.a*AU_SCALE;

      var pGeo = new THREE.SphereGeometry(p.radius*AU_SCALE*4, 24, 24);
      var pMat = new THREE.MeshPhongMaterial({color:p.color, shininess:5});
      var pMesh = new THREE.Mesh(pGeo, pMat);
      pMesh.position.set(x, 0, z);
      solarGroup.add(pMesh);
      clickableObjects.push({obj:pMesh, type:'planet', key:p.name});
      planetMeshes[p.name] = {mesh:pMesh, data:p};

      if(p.hasRing){
        var ringGeo = new THREE.RingGeometry(p.radius*AU_SCALE*4*1.3, p.radius*AU_SCALE*4*2.1, 48);
        var ringMat = new THREE.MeshBasicMaterial({color:0xcbb98a, side:THREE.DoubleSide, transparent:true, opacity:0.6});
        var ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI/2.3;
        pMesh.add(ring);
      }

      p.moons.forEach(function(m, idx){
        var mGeo = new THREE.SphereGeometry(m.radius*AU_SCALE*6, 12, 12);
        var mMat = new THREE.MeshPhongMaterial({color:m.color});
        var mMesh = new THREE.Mesh(mGeo, mMat);
        var mAngle = (idx*70) * Math.PI/180; // spread starting angles; fast simplified orbit, not phase-accurate
        mMesh.position.set(Math.cos(mAngle)*m.dist*AU_SCALE*2.2, 0, Math.sin(mAngle)*m.dist*AU_SCALE*2.2);
        pMesh.add(mMesh);
        m._mesh = mMesh; m._angle = mAngle;
      });

      // Hill sphere (gravitational sphere of influence) — real formula, radius exaggerated for visibility.
      var rHillAU = p.a * Math.pow(p.massEarth/(3*SUN_MASS_EARTH), 1/3);
      var exaggeration = 12;
      var gGeo = new THREE.SphereGeometry(Math.max(rHillAU*AU_SCALE*exaggeration, p.radius*AU_SCALE*5), 20, 20);
      var gMat = new THREE.MeshBasicMaterial({color:0x66ffcc, transparent:true, opacity:0.12, depthWrite:false});
      var gMesh = new THREE.Mesh(gGeo, gMat);
      gMesh.position.copy(pMesh.position);
      gMesh.visible = false;
      solarGroup.add(gMesh);
      gravityMeshes.push(gMesh);
      p._gravMesh = gMesh;
      p._hillAU = rHillAU;
    });
  }

  function daysSinceJ2000(){
    var j2000 = Date.UTC(2000,0,1,12,0,0);
    return (Date.now() - j2000) / 86400000;
  }

  function animateSolarMoons(){
    PLANETS.forEach(function(p){
      p.moons.forEach(function(m){
        if(!m._mesh) return;
        m._angle += 0.01 / Math.max(m.period,0.5);
        m._mesh.position.set(Math.cos(m._angle)*m.dist*AU_SCALE*2.2, 0, Math.sin(m._angle)*m.dist*AU_SCALE*2.2);
      });
    });
  }

  // ---------------- Touch / drag / pinch (shared) ----------------
  function setupTouch(el){
    var dragging = false;
    var lastX=0, lastY=0;
    var lon=0, lat=0;
    var pinchStartDist = null;
    var startZoom = camera.position.z;
    var tapStart = null;

    function rotFromDelta(dx,dy){
      if(mode === 'earth'){
        lon += dx*0.005; lat += dy*0.005;
        lat = Math.max(-1.3, Math.min(1.3, lat));
        globe.rotation.y = lon; globe.rotation.x = lat;
        cloudMesh.rotation.y = lon; cloudMesh.rotation.x = lat;
        Object.keys(overlayMeshes).forEach(function(k){
          overlayMeshes[k].rotation.y = lon; overlayMeshes[k].rotation.x = lat;
        });
      } else {
        solarGroup.rotation.y += dx*0.004;
        solarGroup.rotation.x += dy*0.004;
        solarGroup.rotation.x = Math.max(-1.4, Math.min(1.4, solarGroup.rotation.x));
      }
    }

    function handleTap(x,y){
      var rect = renderer.domElement.getBoundingClientRect();
      var mouse = new THREE.Vector2(
        ((x-rect.left)/rect.width)*2-1,
        -((y-rect.top)/rect.height)*2+1
      );
      raycaster.setFromCamera(mouse, camera);
      var objs = clickableObjects.filter(function(c){
        return mode === 'earth' ? earthGroup.visible && (c.type==='sun'||c.type==='moon') && c.obj.parent
          : solarGroup.visible && (c.type==='sun'||c.type==='planet') && c.obj.parent;
      }).map(function(c){return c.obj;});
      var hits = raycaster.intersectObjects(objs, false);
      if(hits.length){
        var hitObj = hits[0].object;
        var found = clickableObjects.find(function(c){return c.obj===hitObj;});
        if(found) onObjectTapped(found);
      }
    }

    el.addEventListener('touchstart', function(e){
      autoRotate = false;
      if(e.touches.length === 1){
        dragging = true;
        lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
        tapStart = {x:lastX, y:lastY, t:Date.now()};
      } else if(e.touches.length === 2){
        dragging = false;
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.sqrt(dx*dx+dy*dy);
        startZoom = camera.position.z;
      }
    }, {passive:true});

    el.addEventListener('touchmove', function(e){
      if(e.touches.length === 1 && dragging){
        var dx = e.touches[0].clientX - lastX;
        var dy = e.touches[0].clientY - lastY;
        lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
        rotFromDelta(dx,dy);
      } else if(e.touches.length === 2 && pinchStartDist){
        var dx2 = e.touches[0].clientX - e.touches[1].clientX;
        var dy2 = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(dx2*dx2+dy2*dy2);
        var scale = pinchStartDist/dist;
        var z = startZoom*scale;
        var min = mode==='earth' ? 1.4 : 3;
        var max = mode==='earth' ? 6 : 500;
        camera.position.z = Math.max(min, Math.min(max, z));
      }
    }, {passive:true});

    el.addEventListener('touchend', function(e){
      if(tapStart && Date.now()-tapStart.t < 300){
        var dx = (e.changedTouches[0].clientX - tapStart.x);
        var dy = (e.changedTouches[0].clientY - tapStart.y);
        if(Math.sqrt(dx*dx+dy*dy) < 8){ handleTap(tapStart.x, tapStart.y); }
      }
      tapStart = null;
      if(e.touches.length === 0){ dragging = false; pinchStartDist = null; }
    }, {passive:true});

    var mouseDown=false, mouseStart=null;
    el.addEventListener('mousedown', function(e){ mouseDown=true; autoRotate=false; lastX=e.clientX; lastY=e.clientY; mouseStart={x:e.clientX,y:e.clientY,t:Date.now()}; });
    window.addEventListener('mouseup', function(e){
      mouseDown=false;
      if(mouseStart && Date.now()-mouseStart.t<300){
        var dx=e.clientX-mouseStart.x, dy=e.clientY-mouseStart.y;
        if(Math.sqrt(dx*dx+dy*dy)<6){ handleTap(e.clientX,e.clientY); }
      }
    });
    window.addEventListener('mousemove', function(e){
      if(!mouseDown) return;
      var dx = e.clientX-lastX, dy = e.clientY-lastY;
      lastX = e.clientX; lastY = e.clientY;
      rotFromDelta(dx,dy);
    });
    el.addEventListener('wheel', function(e){
      var min = mode==='earth' ? 1.4 : 3;
      var max = mode==='earth' ? 6 : 500;
      camera.position.z = Math.max(min, Math.min(max, camera.position.z + e.deltaY*(mode==='earth'?0.002:0.4)));
    });

    document.querySelector('#panel .close').addEventListener('click', function(){
      document.getElementById('panel').style.display = 'none';
    });
  }

  function onResize(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate(){
    requestAnimationFrame(animate);
    if(mode === 'earth'){
      if(autoRotate){
        globe.rotation.y += rotateSpeed;
        cloudMesh.rotation.y += rotateSpeed;
        Object.keys(overlayMeshes).forEach(function(k){ overlayMeshes[k].rotation.y += rotateSpeed; });
      }
      cloudMesh.rotation.y += 0.00006;
      if(windAnimHandleActive){ stepWindParticles(); }
      if(overlayMeshes['pressure']){
        // "Breathing" pulse — pressure systems aren't static, so give the layer a slow
        // sine-wave pulse in size/opacity rather than sitting as flat dots.
        var t = performance.now() * 0.001;
        var breathe = 0.5 + 0.5*Math.sin(t * 0.5); // ~12.5s full cycle
        overlayMeshes['pressure'].material.size = 0.028 + breathe*0.022;
        overlayMeshes['pressure'].material.opacity = 0.55 + breathe*0.4;
      }
    } else {
      animateSolarMoons();
    }
    renderer.render(scene, camera);
  }

  // ---------------- Weather overlay layers (current conditions, independently toggleable) ----------------
  function disableLayer(layer){
    activeLayers[layer] = false;
    if(overlayMeshes[layer]){ scene.remove(overlayMeshes[layer]); delete overlayMeshes[layer]; }
    if(layer === 'wind'){ disableWindParticles(); }
    checkLiveRefreshTimer();
  }

  function enableLayer(layer){
    var infoEl = document.getElementById('info');
    if(layer === 'wind'){
      infoEl.textContent = "Loading wind vector data…";
      enableWindParticles().then(function(){
        infoEl.textContent = "Drag to rotate • Pinch to zoom";
        markLiveUpdated();
      }).catch(function(err){
        console.error(err);
        setInfoWarning('Wind failed to load: ' + (err.message || 'network error') + ' — tap Wind again to retry');
        activeLayers['wind'] = false;
        document.querySelector('.layer-btn[data-layer="wind"]').classList.remove('active');
        checkLiveRefreshTimer();
      });
      checkLiveRefreshTimer();
      return;
    }
    infoEl.textContent = "Loading " + layer + " data…";
    buildOverlayGrid(layer, null).then(function(){
      infoEl.textContent = "Drag to rotate • Pinch to zoom";
      markLiveUpdated();
    }).catch(function(err){
      console.error(err);
      setInfoWarning(layer + ' failed to load: ' + (err.message || 'network error') + ' — tap it again to retry');
      activeLayers[layer] = false;
      document.querySelector('.layer-btn[data-layer="'+layer+'"]').classList.remove('active');
      checkLiveRefreshTimer();
    });
    checkLiveRefreshTimer();
  }

  // Keeps whichever layers are toggled on fetching fresh data every LIVE_REFRESH_MS,
  // so leaving the app open doesn't leave you looking at a stale snapshot.
  function checkLiveRefreshTimer(){
    var anyActive = Object.keys(activeLayers).some(function(l){ return activeLayers[l]; });
    if(anyActive && !liveRefreshTimer){
      liveRefreshTimer = setInterval(refreshAllActiveLayers, LIVE_REFRESH_MS);
    } else if(!anyActive && liveRefreshTimer){
      clearInterval(liveRefreshTimer);
      liveRefreshTimer = null;
      document.getElementById('liveUpdated').textContent = '';
    }
  }

  function refreshAllActiveLayers(){
    if(forecastPlaying) return; // don't fight with forecast playback
    Object.keys(activeLayers).forEach(function(layer){
      if(!activeLayers[layer]) return;
      if(layer === 'wind'){ refreshWindVectors(); }
      else { buildOverlayGrid(layer, null).catch(function(){}); }
    });
    markLiveUpdated();
  }

  function markLiveUpdated(){
    var now = new Date();
    var hh = String(now.getHours()).padStart(2,'0');
    var mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('liveUpdated').textContent = '● Live — updated ' + hh + ':' + mm + ' (auto-refreshes every 10 min)';
  }

  // ---------------- Wind particle flow (adapted from ParticleFlow's physics loop) ----------------
  // Canonical order carried over from the ParticleFlow app:
  //   velocity += acceleration  ->  position += velocity  ->  color from velocity  ->  velocity *= drag
  // Here "acceleration" each frame steers a particle's velocity toward the real wind vector
  // sampled at its location, "drag" keeps speeds bounded, and color encodes speed exactly like
  // ParticleFlow's cymatic/attractor visuals do.
  var windParticles = null;      // {geo, mesh, particles:[{lat,lon,vLat,vLon,age,life}], grid, uComp, vComp}
  var WIND_PARTICLE_COUNT = 700;
  var windAnimHandleActive = false;

  function windVectorAt(lat, lon, grid, uComp, vComp){
    // Nearest-neighbor lookup on the coarse sample grid (fast, good enough at this resolution).
    var best = 0, bestDist = Infinity;
    for(var i=0;i<grid.latParam.length;i++){
      var dlat = grid.latParam[i]-lat, dlon = grid.lonParam[i]-lon;
      var d = dlat*dlat + dlon*dlon;
      if(d < bestDist){ bestDist = d; best = i; }
    }
    return { u: uComp[best]||0, v: vComp[best]||0 };
  }

  async function enableWindParticles(){
    var grid = buildGridPoints();
    var r = await fetchWeatherGrid(grid, 'wind_speed_10m,wind_direction_10m');
    if(r.failedChunks === r.totalChunks){
      throw new Error((r.lastError && r.lastError.message) || 'all regions failed');
    }
    if(r.failedChunks > 0){
      setInfoWarning('Wind: ' + r.failedChunks + '/' + r.totalChunks + ' regions failed to load — will retry on next refresh');
    }
    // Convert speed+compass-direction into simplified eastward(u)/northward(v) components.
    // Meteorological convention: direction is where wind blows FROM, so the flow vector points
    // 180° opposite — this is a simplified conversion for visualization, not navigation-grade.
    var uComp = [], vComp = [], maxSpeed = 0.001;
    r.results.forEach(function(d){
      var spd = d ? d.wind_speed_10m : 0;
      var dir = d ? d.wind_direction_10m : 0;
      var rad = ((dir||0)+180) * Math.PI/180;
      uComp.push((spd||0) * Math.sin(rad));
      vComp.push((spd||0) * Math.cos(rad));
      if(spd > maxSpeed) maxSpeed = spd;
    });

    var particles = [];
    for(var i=0;i<WIND_PARTICLE_COUNT;i++){
      particles.push(spawnWindParticle());
    }

    var posArr = new Float32Array(WIND_PARTICLE_COUNT*3);
    var colArr = new Float32Array(WIND_PARTICLE_COUNT*3);
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(posArr,3));
    geo.setAttribute('color', new THREE.BufferAttribute(colArr,3));
    var mat = new THREE.PointsMaterial({size:0.02, vertexColors:true, transparent:true, opacity:0.95, depthWrite:false});
    var mesh = new THREE.Points(geo, mat);
    mesh.rotation.copy(globe.rotation);
    scene.add(mesh);

    windParticles = { geo:geo, mesh:mesh, particles:particles, grid:grid, uComp:uComp, vComp:vComp, maxSpeed:maxSpeed };
    overlayMeshes['wind'] = mesh; // so drag-rotation sync + clear-all still pick it up
    windAnimHandleActive = true;
  }

  function spawnWindParticle(){
    return {
      lat: -80 + Math.random()*160,
      lon: -180 + Math.random()*360,
      vLat: 0, vLon: 0,
      age: 0, life: 120 + Math.random()*120
    };
  }

  function disableWindParticles(){
    windAnimHandleActive = false;
    if(windParticles){
      scene.remove(windParticles.mesh);
      windParticles = null;
    }
    delete overlayMeshes['wind'];
  }

  async function refreshWindVectors(){
    if(!windParticles) return;
    var grid = windParticles.grid;
    try{
      var r = await fetchWeatherGrid(grid, 'wind_speed_10m,wind_direction_10m');
      if(r.failedChunks === r.totalChunks) throw new Error('all regions failed');
      var uComp = [], vComp = [], maxSpeed = 0.001;
      r.results.forEach(function(d){
        var spd = d ? d.wind_speed_10m : 0;
        var dir = d ? d.wind_direction_10m : 0;
        var rad = ((dir||0)+180) * Math.PI/180;
        uComp.push((spd||0) * Math.sin(rad));
        vComp.push((spd||0) * Math.cos(rad));
        if(spd > maxSpeed) maxSpeed = spd;
      });
      // Swap in place — particles already in flight keep moving, just get steered by fresh data
      // on their next integration step instead of jumping/resetting.
      windParticles.uComp = uComp;
      windParticles.vComp = vComp;
      windParticles.maxSpeed = maxSpeed;
    } catch(err){
      console.error('wind refresh failed', err);
      setInfoWarning('Wind refresh failed — will retry in 10 min');
    }
  }

  function stepWindParticles(){
    if(!windParticles) return;
    var wp = windParticles;
    var pos = wp.geo.attributes.position.array;
    var col = wp.geo.attributes.color.array;
    var dragFactor = 0.90;
    var accelFactor = 0.18;
    var speedScale = 0.012; // degrees per frame per unit wind speed

    for(var i=0;i<wp.particles.length;i++){
      var p = wp.particles[i];
      var wind = windVectorAt(p.lat, p.lon, wp.grid, wp.uComp, wp.vComp);
      var targetVLon = wind.u * speedScale;
      var targetVLat = wind.v * speedScale;

      // velocity += acceleration  (steer current velocity toward the real wind vector)
      p.vLon += (targetVLon - p.vLon) * accelFactor;
      p.vLat += (targetVLat - p.vLat) * accelFactor;

      // position += velocity
      p.lon += p.vLon;
      p.lat += p.vLat;

      // velocity *= drag
      p.vLon *= dragFactor;
      p.vLat *= dragFactor;

      p.age++;
      if(p.age > p.life || p.lat > 85 || p.lat < -85){
        var fresh = spawnWindParticle();
        p.lat = fresh.lat; p.lon = fresh.lon; p.vLat = 0; p.vLon = 0; p.age = 0; p.life = fresh.life;
      }
      if(p.lon > 180) p.lon -= 360;
      if(p.lon < -180) p.lon += 360;

      var v3 = latLonToVec3(p.lat, p.lon, 1.02);
      pos[i*3] = v3.x; pos[i*3+1] = v3.y; pos[i*3+2] = v3.z;

      // color from velocity (speed) — same principle as ParticleFlow's velocity-driven color
      var speed = Math.sqrt(p.vLat*p.vLat + p.vLon*p.vLon) / speedScale;
      var norm = Math.min(speed / wp.maxSpeed, 1);
      var c = colorForValue('wind', norm);
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    }
    wp.geo.attributes.position.needsUpdate = true;
    wp.geo.attributes.color.needsUpdate = true;
  }

  function latLonToVec3(lat, lon, radius){
    var phi = (90-lat) * (Math.PI/180);
    var theta = (lon+180) * (Math.PI/180);
    return new THREE.Vector3(
      -radius*Math.sin(phi)*Math.cos(theta),
      radius*Math.cos(phi),
      radius*Math.sin(phi)*Math.sin(theta)
    );
  }

  function colorForValue(layer, v){
    var c = new THREE.Color();
    if(layer === 'temp'){ c.setHSL((1-v)*0.66, 1.0, 0.5); }
    else if(layer === 'precip'){ c.setHSL(0.55, 0.9, 0.3+v*0.4); }
    else if(layer === 'clouds'){ c.setHSL(0, 0, 0.5+v*0.5); }
    else if(layer === 'pressure'){ c.setHSL(0.78*(1-v), 0.85, 0.5); }
    else if(layer === 'wind'){ c.setHSL(0.38-v*0.38, 1.0, 0.5); }
    else { c.setHSL(0,0,0.6); }
    return c;
  }

  var FIELD_MAP = {
    temp: 'temperature_2m', precip: 'precipitation', clouds: 'cloud_cover',
    pressure: 'surface_pressure', wind: 'wind_speed_10m'
  };

  function buildGridPoints(){
    var step = 15; // coarser than before — fewer points per request, more reliable on mobile networks
    var lats = [], lons = [];
    for(var la=-75; la<=75; la+=step) lats.push(la);
    for(var lo=-180; lo<180; lo+=step) lons.push(lo);
    var latParam = [], lonParam = [];
    lats.forEach(function(la){ lons.forEach(function(lo){ latParam.push(la); lonParam.push(lo); }); });
    return {latParam:latParam, lonParam:lonParam};
  }

  // Fetches a weather field across the grid in small parallel batches instead of one huge request —
  // a single 400+ point request is fragile on real mobile connections (URL size, timeouts). Batching
  // means a failed chunk only costs you that region, not the whole layer, and failures are reported
  // instead of silently swallowed.
  async function fetchWeatherGrid(grid, fieldsCsv, timeoutMs){
    var chunkSize = 40;
    var chunks = [];
    for(var i=0;i<grid.latParam.length;i+=chunkSize){
      chunks.push({ lat:grid.latParam.slice(i,i+chunkSize), lon:grid.lonParam.slice(i,i+chunkSize), offset:i });
    }
    var results = new Array(grid.latParam.length).fill(null);
    var failedChunks = 0, lastError = null;

    await Promise.all(chunks.map(async function(chunk){
      var controller = new AbortController();
      var timer = setTimeout(function(){ controller.abort(); }, timeoutMs || 9000);
      try{
        var url = "https://api.open-meteo.com/v1/forecast?latitude=" + chunk.lat.join(",") +
                  "&longitude=" + chunk.lon.join(",") + "&current=" + fieldsCsv;
        var res = await fetch(url, {signal: controller.signal});
        if(!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        var list = Array.isArray(data) ? data : [data];
        list.forEach(function(d, idx){ results[chunk.offset+idx] = d.current || null; });
      } catch(err){
        failedChunks++;
        lastError = err;
        console.error('weather chunk failed', err);
      } finally {
        clearTimeout(timer);
      }
    }));

    return { results:results, failedChunks:failedChunks, totalChunks:chunks.length, lastError:lastError };
  }

  async function buildOverlayGrid(layer, valuesOverride){
    var grid = buildGridPoints();
    var values;
    if(valuesOverride){
      values = valuesOverride;
    } else {
      var r = await fetchWeatherGrid(grid, FIELD_MAP[layer]);
      if(r.failedChunks === r.totalChunks){
        throw new Error((r.lastError && r.lastError.message) || 'all regions failed');
      }
      if(r.failedChunks > 0){
        setInfoWarning(layer + ': ' + r.failedChunks + '/' + r.totalChunks + ' regions failed to load — will retry on next refresh');
      }
      values = r.results.map(function(d){ return d ? d[FIELD_MAP[layer]] : null; });
    }
    renderGrid(layer, grid, values);
  }

  function renderGrid(layer, grid, values){
    var positions = [], colors = [];
    var valid = values.filter(function(v){ return v!==null && v!==undefined; });
    var min = Math.min.apply(null, valid), max = Math.max.apply(null, valid);
    if(min===max) max = min+1;
    for(var i=0;i<values.length;i++){
      var v = values[i];
      if(v===null || v===undefined) continue;
      var norm = (v-min)/(max-min);
      var p = latLonToVec3(grid.latParam[i], grid.lonParam[i], 1.02 + (LAYER_SHELL_OFFSET[layer]||0));
      positions.push(p.x,p.y,p.z);
      var col = colorForValue(layer, norm);
      colors.push(col.r,col.g,col.b);
    }
    if(overlayMeshes[layer]){ scene.remove(overlayMeshes[layer]); }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
    var mat = new THREE.PointsMaterial({size:0.035, vertexColors:true, transparent:true, opacity:0.9, depthWrite:false});
    var mesh = new THREE.Points(geo, mat);
    mesh.rotation.copy(globe.rotation);
    scene.add(mesh);
    overlayMeshes[layer] = mesh;
  }

  // When multiple layers are on at once, stack their point shells slightly apart so they don't z-fight.
  var LAYER_SHELL_OFFSET = { temp:0, precip:0.01, clouds:0.02, pressure:0.03, wind:0.04 };

  // ---------------- Forecast playback (real Open-Meteo hourly forecast, ~48h) ----------------
  // Plays back every layer that's currently toggled on, in sync.
  async function startForecast(){
    // Wind is now a live particle flow (real-time, continuously animated) rather than a
    // static snapshot, so it's excluded from hourly forecast playback.
    var layers = Object.keys(activeLayers).filter(function(l){ return activeLayers[l] && l !== 'wind'; });
    if(!layers.length){
      document.getElementById('info').textContent = 'Turn on at least one layer (Temp/Precip/etc) before playing the forecast';
      return;
    }
    var btn = document.getElementById('playBtn');
    btn.textContent = '⏳ Loading…';
    var grid = buildGridPoints();
    try{
      var perLayer = {};
      await Promise.all(layers.map(async function(layer){
        var field = FIELD_MAP[layer];
        var url = "https://api.open-meteo.com/v1/forecast?latitude=" + grid.latParam.join(",") +
                  "&longitude=" + grid.lonParam.join(",") +
                  "&hourly=" + field + "&forecast_hours=48";
        var res = await fetch(url);
        var data = await res.json();
        var list = Array.isArray(data) ? data : [data];
        perLayer[layer] = { field:field, points:list, times:(list[0]&&list[0].hourly?list[0].hourly.time:[]) };
      }));
      forecastData = { grid:grid, layers:perLayer };
      forecastIndex = 0;
      forecastPlaying = true;
      btn.textContent = '⏸ Pause';
      btn.classList.add('active');
      document.getElementById('forecastBar').style.display = 'block';
      stepForecast();
      forecastTimer = setInterval(stepForecast, 900);
    } catch(err){
      btn.textContent = '▶ Forecast';
      document.getElementById('info').textContent = 'Forecast unavailable (offline?)';
    }
  }

  function stepForecast(){
    if(!forecastData) return;
    var layerKeys = Object.keys(forecastData.layers);
    var refTimes = null, totalHours = 0;
    layerKeys.forEach(function(layer){
      var ld = forecastData.layers[layer];
      if(!ld.times.length) return;
      if(!refTimes){ refTimes = ld.times; totalHours = ld.times.length; }
      var values = ld.points.map(function(d){
        return (d.hourly && d.hourly[ld.field]) ? d.hourly[ld.field][forecastIndex] : null;
      });
      renderGrid(layer, forecastData.grid, values);
    });
    var t = refTimes ? refTimes[forecastIndex] : null;
    document.getElementById('forecastBar').textContent = 'Forecast: ' + (t ? t.replace('T',' ') + ' UTC' : '') +
      '  (hour ' + (forecastIndex+1) + ' of ' + totalHours + ') — real Open-Meteo hourly forecast — layers: ' + layerKeys.join(', ');
    forecastIndex = (forecastIndex + 1) % Math.max(totalHours,1);
  }

  function stopForecast(){
    forecastPlaying = false;
    if(forecastTimer){ clearInterval(forecastTimer); forecastTimer = null; }
    var btn = document.getElementById('playBtn');
    btn.textContent = '▶ Forecast';
    btn.classList.remove('active');
    document.getElementById('forecastBar').style.display = 'none';
  }

  init();
})();
</script>
</body>
</html>
